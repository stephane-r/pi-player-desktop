<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>IPTV Player (bureau)</title>
<link rel="stylesheet" href="vendor/bulma.min.css">
<style>
  * { box-sizing: border-box; }
  /* Aligne l'accent de Bulma (teinte/saturation/luminosité, pas la couleur composée directement :
     tous les dérivés - hover, fond clair, etc. - sont calculés à partir de ces 3 variables) sur
     notre bleu existant. */
  :root {
    --bulma-primary-h: 217deg;
    --bulma-primary-s: 91%;
    --bulma-primary-l: 60%;
    --bulma-link-h: 217deg;
    --bulma-link-s: 91%;
    --bulma-link-l: 60%;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* --- Login screen --- */
  /* Bulma fournit déjà l'apparence de la carte (.box) et des champs (.input/.button) ; on ne garde
     que le positionnement propre à cet écran. */
  #login { margin: auto; width: 320px; }
  #login .input { margin-bottom: 10px; user-select: text; }
  #login .error { color: #f87171; font-size: 13px; margin-top: 8px; }

  /* --- App layout --- */
  #app { display: none; flex: 1; min-height: 0; flex-direction: column; }
  header {
    padding: 10px 16px;
    background: #1c1c1c;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
  }

  #tabs { display: flex; background: #161616; border-bottom: 1px solid #333; }
  .tab-btn {
    flex: none;
    padding: 10px 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #999;
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn.active { color: #fff; border-bottom-color: #3b82f6; }
  .tab-btn:hover { color: #fff; }

  #main { flex: 1; display: flex; min-height: 0; }

  #categories {
    width: 220px;
    overflow-y: auto;
    background: #181818;
    border-right: 1px solid #333;
  }
  #channels {
    width: 300px;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #channel-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  #player-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    min-width: 0;
  }
  /* La vidéo s'ouvre dans sa propre fenêtre mpv (barre de titre, redimensionnable, plein écran
     natif) : cette zone ne sert qu'à afficher les contrôles et le statut de lecture. */
  #video-surface {
    flex: 1;
    background: #000;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #1c1c1c;
    border-top: 1px solid #333;
  }
  #seek-bar { flex: 1; accent-color: #3b82f6; }
  #time-label { font-size: 12px; color: #aaa; min-width: 100px; text-align: right; }
  #controls .select, #controls .select select { font-size: 12px; max-width: 140px; }

  #now-playing { padding: 10px; font-size: 14px; color: #aaa; background: #1c1c1c; }

  .item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item:hover { background: #2a2a2a; }
  .item.active { background: #3b82f6; color: #fff; }

  /* Ligne nom+EPG (chaînes live) : toute la zone (nom + sous-ligne EPG) forme un seul bloc
     cliquable/survolable, d'où un conteneur .item-row séparé plutôt que de réutiliser .item. */
  .item-row { cursor: pointer; border-bottom: 1px solid #222; }
  .item-row:hover { background: #2a2a2a; }
  .item-row.active { background: #3b82f6; color: #fff; }
  .item-row.active .item-epg { color: #cbd5e1; }
  .item-row-main {
    padding: 10px 14px;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .item-icon {
    flex: none;
    width: 28px;
    height: 28px;
    object-fit: contain;
    border-radius: 4px;
    background: #222;
  }
  .item-epg {
    padding: 0 14px 10px 14px;
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fav-btn {
    flex: none;
    background: none;
    border: none;
    color: #666;
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
  }
  .fav-btn.active { color: #fbbf24; }
  .fav-btn:hover { color: #fbbf24; }

  .group-header {
    background: #1f1f1f;
    color: #ddd;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .group-header:hover { background: #2a2a2a; }

  #search {
    width: 100%;
    padding: 8px;
    border: none;
    border-bottom: 1px solid #333;
    background: #202020;
    color: #eee;
    user-select: text;
  }

  .loading { padding: 16px; color: #888; font-size: 13px; }
</style>
</head>
<body>

  <div id="login" class="box">
    <h1 class="title is-5">Connexion IPTV</h1>
    <input id="f-host" class="input" placeholder="Host (ex: smart.200300.org:8080)" value="smart.200300.org:8080">
    <input id="f-user" class="input" placeholder="Username">
    <input id="f-pass" class="input" placeholder="Password" type="password">
    <button class="button is-primary is-fullwidth" onclick="connect()">Se connecter</button>
    <div class="error" id="login-error"></div>
  </div>

  <div id="app">
    <header>
      <div>
        <strong id="account-label"></strong>
        <span id="app-version" style="color:#666; font-size:12px; margin-left:8px;"></span>
      </div>
      <div>
        <button class="button is-small" onclick="downloadM3U()" style="display:none">⬇️ Télécharger M3U (TV)</button>
        <button class="button is-small" onclick="logout()">Déconnexion</button>
      </div>
    </header>
    <div id="tabs">
      <button class="tab-btn active" data-tab="live" onclick="switchTab('live')">📺 TV</button>
      <button class="tab-btn" data-tab="vod" onclick="switchTab('vod')">🎬 Films</button>
      <button class="tab-btn" data-tab="series" onclick="switchTab('series')">📚 Séries</button>
    </div>
    <div id="main">
      <div id="categories"><div class="loading">Chargement des catégories...</div></div>
      <div id="channels">
        <input id="search" placeholder="Rechercher..." oninput="renderItems()">
        <div id="channel-list"></div>
      </div>
      <div id="player-pane">
        <div id="video-surface">La vidéo s'ouvre dans une fenêtre mpv séparée.</div>
        <div id="controls">
          <button id="btn-playpause" class="button is-small" onclick="togglePause()">⏸</button>
          <input id="seek-bar" type="range" min="0" max="1000" value="0" oninput="onSeekBarInput()">
          <span id="time-label">00:00 / 00:00</span>
          <div class="select is-small">
            <select id="audio-track-select" onchange="onAudioTrackChange()"><option value="">Audio</option></select>
          </div>
          <div class="select is-small">
            <select id="sub-track-select" onchange="onSubtitleTrackChange()"><option value="">Sous-titres</option></select>
          </div>
        </div>
        <div id="now-playing">Sélectionne un contenu</div>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
